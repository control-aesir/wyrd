# Heavy live-mailbox flood tests are crypto- (NIP-59 seal per wrap) and
# fsync-bound (one sync per ack) and each spawns parallel seal workers
# plus relay/client runtimes. Running them concurrently oversubscribes
# the machine and they all crawl, so they share one serial group while
# the rest of the suite keeps full parallelism.
[test-groups]
mailbox-flood = { max-threads = 1 }
mailbox-slow = { max-threads = 1 }
contracts-serial = { max-threads = 1 }
# The whole contracts binary runs its tests one at a time (other
# binaries keep full parallelism: groups only constrain their own
# process). See the override below for why.

# The >10s live-relay integration tests (flood, saturation replay,
# outage recovery) are excluded from the default profile so local and
# PR runs stay fast, and included in the `slow` profile the master CI
# gate runs. They stay ordinary tests, not `#[ignore]`d: the ignore
# attribute is reserved for tests that need external resources (a public
# relay, kernel FUSE) or are blocked on future work, which must never
# run in CI. Substrings are distinctive enough to select exactly these
# five without a name-by-name list at each call site.
[profile.default]
default-filter = "not (test(~flood_beyond_channel_capacity) or test(~saturation_recovers_broadcast_drops) or test(~saturation_recoveries_keep_single) or test(~restart_past_retention_redelivers) or test(~relay_outage_marks_down))"

[profile.slow]
default-filter = "test(~flood_beyond_channel_capacity) or test(~saturation_recovers_broadcast_drops) or test(~saturation_recoveries_keep_single) or test(~restart_past_retention_redelivers) or test(~relay_outage_marks_down)"

[[profile.default.overrides]]
filter = 'test(flood)'
test-group = 'mailbox-flood'

[[profile.default.overrides]]
filter = 'test(saturation)'
test-group = 'mailbox-flood'

[[profile.default.overrides]]
filter = 'test(unacked_bound)'
test-group = 'mailbox-flood'

# The live-iroh serving contract owns multi-thread runtimes whose worker
# threads are born during its run. Nextest attributes threads present at
# a test's end but absent at its start to that test — so under load, when
# runtime init straddles a fast concurrent test's sub-second window, the
# fast test eats a LEAK verdict for threads it never created (observed:
# three different synchronous-only tests blamed across runs, none of
# which spawns anything). threads-required does not isolate in this
# setup (verified: the iroh test still overlaps with threads-required
# set), so the whole contracts binary shares one serial group instead:
# no two tests in the process ever overlap, which removes the
# misattribution condition outright. ~9s becomes ~25s; the rest of the
# workspace keeps full parallelism. See the leaky-verdict issue for the
# attribution evidence.
[[profile.default.overrides]]
filter = 'package(wyrd-contracts)'
test-group = 'contracts-serial'

# The slow profile runs only the five heavy tests above; serializing the
# whole binary keeps them from oversubscribing the machine (same reason
# as the default-profile flood group).
[[profile.slow.overrides]]
filter = 'all()'
test-group = 'mailbox-slow'
