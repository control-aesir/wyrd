# Heavy live-mailbox flood tests are crypto-bound (NIP-59 seal per wrap;
# consumption floods are additionally fsync-bound at one sync per ack,
# while poison floods pay no sync per delivery) and each spawns parallel
# seal workers plus relay/client runtimes. Running them concurrently
# oversubscribes the machine and they all crawl, so they share one
# serial group while the rest of the suite keeps full parallelism.
[test-groups]
mailbox-flood = { max-threads = 1 }
mailbox-slow = { max-threads = 1 }
contracts-serial = { max-threads = 1 }
# The whole contracts binary runs its tests one at a time (other
# binaries keep full parallelism: groups only constrain their own
# process). See the override below for why.

# The >10s live-relay integration tests (flood, saturation replay,
# outage recovery) are excluded from the default profile so local and
# PR runs stay fast, and included in the `slow` profile the master CI
# gate runs. They stay ordinary tests, not `#[ignore]`d: the ignore
# attribute is reserved for tests that need external resources (a public
# relay, kernel FUSE) or are blocked on future work, which must never
# run in CI. Substrings are distinctive enough to select exactly these
# nine without a name-by-name list at each call site.
[profile.default]
default-filter = "not (test(~flood_beyond_channel_capacity) or test(~saturation_recovers_broadcast_drops) or test(~saturation_recoveries_keep_single) or test(~restart_past_retention_redelivers) or test(~relay_outage_marks_down) or test(~serving_restart_with_accumulated_failures) or test(~poison_flood_stays_memory_only_at_scale) or test(~retry_flood_holds_at_most_one_window) or test(~two_relays_cover))"
# Nextest's LEAK verdict fires when a test's stdout/stderr pipes stay
# open past its exit: a live child process inheriting them, or an event
# loop too loaded to observe the EOF within the window. Nextest runs
# each test in its own process (verified: test binaries execute with
# `--exact <single-test>`), so threads can never cross tests — the old
# thread-misattribution theory recorded here and in the Sep-18
# contracts-serial change is wrong; serializing only helped by
# lightening the load. All pinned verdicts hit fast sync-only tests
# that spawn nothing (their processes cannot hold their own pipes) in
# the first second of a workspace run, when all seven test binaries
# spawn at once and the observer starves past the sub-second default.
# (Mount helpers do fork — vendored fuser shells umount — but those
# live in mount-test processes, never in the blamed ones.) 5s keeps
# the LEAK marker for a genuine leak while surviving the startup storm;
# it costs nothing on clean runs since the wait only bites when the
# pipes are still open. See the leaky-verdict issue for the pin
# evidence (four blamed innocents across wyrd-cli and wyrd-core).
leak-timeout = "5s"

[profile.slow]
default-filter = "test(~flood_beyond_channel_capacity) or test(~saturation_recovers_broadcast_drops) or test(~saturation_recoveries_keep_single) or test(~restart_past_retention_redelivers) or test(~relay_outage_marks_down) or test(~serving_restart_with_accumulated_failures) or test(~poison_flood_stays_memory_only_at_scale) or test(~retry_flood_holds_at_most_one_window) or test(~two_relays_cover)"

[[profile.default.overrides]]
filter = 'test(flood)'
test-group = 'mailbox-flood'

[[profile.default.overrides]]
filter = 'test(saturation)'
test-group = 'mailbox-flood'

[[profile.default.overrides]]
filter = 'test(unacked_bound)'
test-group = 'mailbox-flood'

# The contracts binary was the first place LEAK verdicts landed
# (observed: three different synchronous-only tests blamed across runs,
# none of which spawns anything). The Sep-18 read was thread
# misattribution; with process-per-test since confirmed, the mechanism
# is observer starvation under the startup storm (see the leak-timeout
# note above). The serial group stays as load reduction while the 5s
# window is the actual fix: ~9s becomes ~25s, the rest of the workspace
# keeps full parallelism. See the leaky-verdict issue for the pin
# evidence.
[[profile.default.overrides]]
filter = 'package(wyrd-contracts)'
test-group = 'contracts-serial'

# The slow profile runs only the heavy tests above; serializing the
# whole binary keeps them from oversubscribing the machine (same reason
# as the default-profile flood group).
[[profile.slow.overrides]]
filter = 'all()'
test-group = 'mailbox-slow'
