name: AI Code Review
on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget gnupg
          # Install ngit
          curl -Ls https://ngit.dev/install.sh | bash
          # Set PATH for subsequent steps
          echo "/home/runner/.local/bin" >> $GITHUB_PATH
          
      - name: AI Code Review
        env:
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Your AI review script here
          echo "Analyzing PR #${{ github.event.pull_request.number }}"
          # Example: invoke AI model to review changes
          python .ngit/scripts/ai-review.py
