name: nix

on:
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Flake evaluation needs a Git repository and the coordinator
      # worktree may carry no .git metadata; synthesize one so `nix flake
      # check` resolves the worktree. Respects .gitignore, so build output
      # and dev state stay out.
      - name: Prepare git metadata for flake evaluation
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            git init -q
            git add -A
            git -c user.email=ci@localhost -c user.name=ci commit -qm ci
          fi
          git config --global --add safe.directory "$PWD"

      # Builds packages.wyrd, packages.wyrd-dist, and checks.wyrd* for the
      # runner's system (linux-x86_64). Darwin coverage comes from the
      # maintainer's machine; see the packaging issue.
      - name: Flake check
        run: nix flake check --print-build-logs

      # Proves the release archive path end to end: the tarball named in
      # .ngit/release.yaml unpacks to a working wyrd for this platform.
      - name: Release archive smoke test
        run: |
          set -euo pipefail
          nix build .#wyrd-dist --print-build-logs
          rm -rf /tmp/wyrd-dist-smoke && mkdir -p /tmp/wyrd-dist-smoke
          tar -xzf result -C /tmp/wyrd-dist-smoke
          bin=$(echo /tmp/wyrd-dist-smoke/*/bin/wyrd)
          test -x "$bin"
          "$bin" --version
