name: nix

on:
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Builds packages.wyrd and checks.wyrd for the runner's system
      # (linux-x86_64). Darwin coverage comes from the maintainer's
      # machine; see the packaging issue.
      - name: Flake check
        run: nix flake check --print-build-logs
