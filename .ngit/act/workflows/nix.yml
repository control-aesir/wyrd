name: nix

on:
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".ngit/act/workflows/nix.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # cache-nix-action assumes GitHub-hosted runners: its save phase
      # chowns the Nix db to a hardcoded `runner:runner` user and
      # checkpoints it with `sqlite3`, neither of which exists in act
      # containers. Without both shims the save fails silently and every
      # run rebuilds cold.
      - name: Prepare cache tooling
        run: |
          set -euo pipefail
          id runner >/dev/null 2>&1 || sudo useradd -r -U -M -s /usr/sbin/nologin runner
          command -v sqlite3 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y sqlite3; }

      # Warm /nix/store across runs: without this every run recompiles
      # the whole Rust dependency closure from source on a cold store
      # (~4 minutes of the flake check). Scoped by repository and trigger
      # trust, so third-party PRs never touch the maintainer cache.
      # continue-on-error keeps coordinators with caching disabled green.
      - name: Restore Nix store cache
        continue-on-error: true
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          token: unused

      # Flake evaluation needs an openable Git repository (libgit2
      # ENOTFOUND otherwise) and the coordinator worktree can carry a stub
      # or no .git metadata at all. Rebuild it when git itself cannot open
      # it. Respects .gitignore, so build output and dev state stay out.
      - name: Prepare git metadata for flake evaluation
        run: |
          set -euo pipefail
          set -o pipefail
          {
            git config --global --add safe.directory "$PWD"
            if ! git rev-parse --git-dir >/dev/null 2>&1; then
              rm -rf .git
              git init -q
              git add -A
              git -c user.email=ci@localhost -c user.name=ci commit -qm ci
            fi
          } 2>&1 | tee /tmp/nix-git.log

      # Builds packages.wyrd, packages.wyrd-dist, and checks.wyrd* for the
      # runner's system (linux-x86_64). Darwin coverage comes from the
      # maintainer's machine; see the packaging issue.
      - name: Flake check
        run: |
          set -o pipefail
          nix flake check --print-build-logs 2>&1 | tee /tmp/nix-check.log

      # Disabled for now: the dist rebuild recompiles the whole Rust
      # closure on every PR run. Re-add for releases, where the
      # byte-exact reproducibility proof is worth the cost (see the nix
      # workflow streamlining issue).
      # Proves the release archive path end to end: the tarball filename is
      # exactly what .ngit/release.yaml publishes for this platform, and it
      # unpacks to a working wyrd. Full `--rebuild` reproducibility is
      # verified at change time (it rebuilds the whole Rust closure, too
      # expensive for every CI run); see the distFor comment in flake.nix.
      # - name: Release archive smoke test
      #   run: |
      #     set -euo pipefail
      #     set -o pipefail
      #     {
      #       nix build .#wyrd-dist --print-build-logs
      #       # The built filename must be one of the version-expanded `file:`
      #       # paths in .ngit/release.yaml (whose entries keep the literal
      #       # {version} placeholder).
      #       name=$(nix eval --raw .#wyrd-dist.name)
      #       version=$(nix eval --raw .#wyrd.version)
      #       grep -o 'dist/[^ ]*' .ngit/release.yaml \
      #         | sed "s/{version}/$version/" \
      #         | grep -qxF "dist/$name"
      #       rm -rf /tmp/wyrd-dist-smoke && mkdir -p /tmp/wyrd-dist-smoke
      #       tar -xzf result -C /tmp/wyrd-dist-smoke
      #       bin=$(echo /tmp/wyrd-dist-smoke/*/bin/wyrd)
      #       test -x "$bin"
      #       "$bin" --version
      #     } 2>&1 | tee /tmp/nix-dist.log

      # Installs ngit for the failure reporter below, from a
      # checksum-pinned manifest. Runs only on `pull_request` failures,
      # matching the reporter condition, so green runs pay nothing.
      - name: Install ngit for failure reporting
        if: failure() && github.event_name == 'pull_request'
        uses: danconwaydev/setup-ngit@v3
        with:
          version: 3.0.1

      # On `pull_request` failures only: post a truncated failure tail on
      # the PR and return it to draft, same steady state as rust-ci. Master
      # pushes and dispatch runs have no PR to draft and are excluded by
      # the step condition. NGIT_NSEC lives only in this step's env:
      # earlier steps run untrusted PR code and must never see it. The CI
      # identity must be a confirmed co-maintainer; third-party PRs run
      # with empty secrets by design, so a withheld secret skips gracefully
      # instead of failing. After auto-draft the author pushes the fix
      # (drafts run no CI) and marks ready again to re-trigger.
      #
      # PR resolution keys on the checked-out head sha first: it is exact
      # even with several PRs open and needs no trigger context. The
      # trigger-event and head-ref paths below stay as alternatives for
      # coordinators that provide them — the installed coordinator
      # documents no NGIT_CI_TRIGGER_EVENT, and synthesized pull_request
      # events carry no head.ref (GITHUB_REF is just refs/pull/ngit).
      # Unresolvable runs fail loudly, never skip silently.
      #
      # Every ngit call passes --repo explicitly: the coordinator checks
      # out over https/file with no nostr remote, and ngit fails rather
      # than guessing. The value is this repo's naddr (ngit 3.0.1 rejects
      # the raw 30617: coordinate form); refresh it with
      # `ngit repo --json | jq -r .coordinate` if the repo is republished.
      - name: Report failure to PR and return to draft
        if: failure() && github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
        run: |
          set -euo pipefail

          REPO_NADDR="naddr1qqz8w7tjvspzpv7ftn3nm75yxfnpr69h48qsk7xl9p65cw93q6jtcqvkhxl97nj2qvzqqqrhnyzuuxrw"

          # Withheld bot credential: nothing to publish with, and no
          # connected relay for this identity. Skip without masking the
          # real test failure.
          if [ -z "${NGIT_NSEC:-}" ]; then
            echo "NGIT_NSEC is not configured; skipping PR failure report."
            exit 0
          fi

          command -v jq >/dev/null || {
            echo "jq is required for PR resolution" >&2
            exit 1
          }

          PR_ID=""
          # Primary resolution: match the checked-out head sha against
          # per-revision commits in each open/draft PR's CI record. Exact
          # even with several PRs open, and needs no trigger context.
          # Multiple matches fail loudly below — never guess.
          if [ -n "${GITHUB_SHA:-}" ]; then
            sha_matches=""
            candidates="$(
              ngit --repo "$REPO_NADDR" pr list --json --status open,draft |
                jq -r '.[].id' || true
            )"
            for candidate in $candidates; do
              if ngit --repo "$REPO_NADDR" pr view "$candidate" --json |
                jq -e --arg sha "$GITHUB_SHA" '
                  ([(.ci.runs // [] | .[].commit),
                    (.ci.outdated // [] | .[].commit)]
                   | map(select(. != null))
                   | any(. == $sha))' >/dev/null 2>&1; then
                sha_matches="${sha_matches:+$sha_matches }$candidate"
              fi
            done
            set -- $sha_matches
            if [ "$#" -eq 1 ]; then
              PR_ID="$1"
            elif [ "$#" -gt 1 ]; then
              echo "Head sha matches multiple PRs; refusing to guess: $sha_matches" >&2
              exit 1
            fi
          fi

          # Alternative for coordinators that export the trigger event:
          # ngit maps a 1618 proposal or a 1619 revision to its PR.
          if [ -z "$PR_ID" ] && [ -n "${NGIT_CI_TRIGGER_EVENT:-}" ]; then
            PR_ID="$(
              ngit --repo "$REPO_NADDR" \
                ci status "$NGIT_CI_TRIGGER_EVENT" --json |
                jq -r '.target.pr // empty' || true
            )"
          fi

          # Alternative for triggers that still carry the branch (e.g. opened).
          # Listed branches render as `pr/<name>(<short-id>)`, so match the
          # bare name too.
          if [ -z "$PR_ID" ] && [ -n "${PR_BRANCH:-}" ]; then
            PR_ID="$(
              ngit --repo "$REPO_NADDR" pr list --json |
                jq -r --arg branch "$PR_BRANCH" '
                  .[] |
                  select(.branch == $branch or
                    (.branch | startswith($branch + "("))) |
                  .id
                ' | head -n1 || true
            )"
          fi

          if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
            echo "Could not resolve the PR for this run; refusing to skip silently." >&2
            echo "trigger=${NGIT_CI_TRIGGER_EVENT:-unknown} branch=${PR_BRANCH:-unknown} sha=${GITHUB_SHA:-unknown}" >&2
            exit 1
          fi

          echo "Reporting CI failure on PR: $PR_ID"

          # Keep the secret out of every other process environment: file it,
          # drop it from env, and remove the file as soon as ngit is done.
          NGIT_NSEC_FILE="$RUNNER_TEMP/ngit-nsec"
          printf '%s' "$NGIT_NSEC" > "$NGIT_NSEC_FILE"
          chmod 600 "$NGIT_NSEC_FILE"
          unset NGIT_NSEC
          trap 'rm -f "$NGIT_NSEC_FILE"' EXIT

          # Truncated failure tail: last lines of whichever gate logs exist.
          # Capped so the comment stays a readable signal, not a log dump.
          COMMENT_BODY="/tmp/failure-comment.md"
          {
            echo "## CI failed - PR returned to draft"
            echo ""
            echo "Commit: \`${GITHUB_SHA:-unknown}\`"
            echo ""
            echo "The failing run's tail is below (truncated). Push the fix"
            echo "(drafts run no CI) and mark ready again to re-trigger."
            echo ""
            for log in /tmp/nix-git.log /tmp/nix-check.log /tmp/nix-dist.log; do
              if [ -f "$log" ]; then
                echo "<details>"
                echo "<summary><code>$(basename "$log")</code> (last 100 lines)</summary>"
                echo ""
                echo '```'
                tail -n 100 "$log"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > "$COMMENT_BODY"

          # Bound the event payload: keep the header, cut the tail to size.
          if [ "$(wc -c < "$COMMENT_BODY")" -gt 8000 ]; then
            tail -c 8000 "$COMMENT_BODY" > "$COMMENT_BODY.trimmed"
            {
              echo "## CI failed - PR returned to draft"
              echo ""
              echo "(Failure tail truncated to the last 8 KB.)"
              echo ""
              cat "$COMMENT_BODY.trimmed"
            } > "$COMMENT_BODY"
            rm -f "$COMMENT_BODY.trimmed"
          fi

          ngit --repo "$REPO_NADDR" \
            --nsec-file "$NGIT_NSEC_FILE" \
            pr comment "$PR_ID" \
            --body "$(cat "$COMMENT_BODY")" \
            --json

          ngit --repo "$REPO_NADDR" \
            --nsec-file "$NGIT_NSEC_FILE" \
            pr draft "$PR_ID" \
            --reason "CI failed - returned to draft automatically" \
            --json
