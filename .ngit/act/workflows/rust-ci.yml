name: rust-ci

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Resolve the channel pinned in rust-toolchain.toml. It is passed as an
      # explicit `toolchain` input rather than letting the action read the
      # file: file-driven mode installs every target in the file (the macOS
      # and Linux cross-compile triples), and a literal "rust-toolchain.toml"
      # value is rejected by rustup as an invalid toolchain name.
      - name: Resolve pinned channel
        id: pin
        run:
          echo "channel=$(awk -F'"' '/^channel/{print $2}'
          rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Installs rustup when missing (the ngit/act ubuntu image doesn't ship
      # it), then the pinned channel with a minimal profile + clippy.
      # Toolchain and registry are cached between runs.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy

      # Pre-built nextest binary (nextest-rs recommended installer).
      - uses: taiki-e/install-action@nextest

      - name: Check
        run: |
          set -o pipefail
          cargo check --color never 2>&1 | tee /tmp/check.log

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      # `insecure-fast-kdf` deliberately weakens the keystore KDF and is
      # enabled only from dev-dependencies so integration tests can build a
      # real Engine affordably. Guard production: the normal dependency graph
      # (no dev/test edges) must never enable it. Never treat an
      # `--all-features` artifact as production.
      - name: Production feature graph excludes insecure-fast-kdf
        run: |
          set -euo pipefail
          cargo tree -e normal,features --workspace > /tmp/features.log
          if grep -q insecure-fast-kdf /tmp/features.log; then
            echo "error: the normal dependency graph enables insecure-fast-kdf" >&2
            grep -n insecure-fast-kdf /tmp/features.log >&2
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          cargo nextest run --color never --workspace 2>&1 | tee /tmp/test.log

      # Nextest skips doctests; this gate keeps them validated as API
      # examples appear. Cheap while empty, load-bearing later.
      - name: Doctests
        run: |
          set -o pipefail
          cargo test --color never --workspace --doc 2>&1 | tee /tmp/doctests.log

      # Installs ngit for the failure reporter below, from a
      # checksum-pinned manifest. Runs only on `pull_request` failures,
      # matching the reporter condition, so green runs pay nothing.
      - name: Install ngit for failure reporting
        if: failure() && github.event_name == 'pull_request'
        uses: danconwaydev/setup-ngit@v3
        with:
          version: 3.0.1

      # On `pull_request` failures only: post a truncated failure tail on
      # the PR and return it to draft so the board stops advertising a
      # ready PR. Master pushes and dispatch runs have no PR to draft and
      # are excluded by the step condition. The shared reporter library
      # holds the resolution, comment, and draft logic (see
      # .ngit/act/lib/ngit-reporter.sh); only the gate logs differ per
      # workflow and pass as arguments below.
      - name: Report failure to PR and return to draft
        if: failure() && github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .ngit/act/lib/ngit-reporter.sh
          report_failure_to_pr \
            /tmp/check.log /tmp/clippy.log /tmp/features.log /tmp/test.log /tmp/doctests.log

      # Disabled since it's not working for now
      # - if: github.event_name == 'pull_request'
      - if: false
        name: Run OpenCode review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl wget gnupg

          # Install ngit and OpenCode
          curl -Ls https://ngit.dev/install.sh | bash
          curl -fsSL https://opencode.ai/install | bash

          # Make installed binaries available
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          # Fetch the actual PR base branch.
          git fetch origin "$BASE_BRANCH" --depth=1

          # Keep the ngit secret out of OpenCode's environment.
          NGIT_NSEC_FILE="$RUNNER_TEMP/ngit-nsec"
          printf '%s' "$NGIT_NSEC" > "$NGIT_NSEC_FILE"
          chmod 600 "$NGIT_NSEC_FILE"
          unset NGIT_NSEC

          # Gather PR metadata for the reviewer.
          PR_INFO="$(ngit pr list --json)"
          PR_ID="$(
            printf '%s\n' "$PR_INFO" |
              jq -r --arg branch "$PR_BRANCH" '
                .[] |
                select(.branch == $branch) |
                .id
              ' |
              head -n1
          )"

          if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
            echo "Could not determine ngit PR ID for branch: $PR_BRANCH"
            echo "$PR_INFO"
            exit 1
          fi

          echo "Reviewing PR: $PR_ID"
          echo "Branch: $PR_BRANCH"
          echo "Base: $BASE_BRANCH"

          # Ask OpenCode to perform the review.
          opencode run \
            --model openrouter/openrouter/free \
            "$(cat <<EOF
          # Full branch code review

          You are reviewing a pull request.

          PR branch: ${PR_BRANCH}
          Base branch: ${BASE_BRANCH}
          PR ID: ${PR_ID}

          ## Recent commits

          !git log origin/${BASE_BRANCH}..HEAD --oneline

          ## Diff statistics

          !git diff origin/${BASE_BRANCH}...HEAD --stat

          ## Full diff

          !git diff origin/${BASE_BRANCH}...HEAD

          ## Code quality checks

          ### Check

          !cat /tmp/check.log

          ### Clippy

          !cat /tmp/clippy.log

          ### Tests

          !cat /tmp/test.log

          ## Your task

          Perform a comprehensive code review of the current branch compared
          with the base branch.

          Do not limit the review to the supplied diff summary. Inspect the
          repository and relevant surrounding code as necessary to understand
          the changes and their invariants.

          Cover:

          1. Overall assessment
          2. Potential bugs and edge cases
          3. Correctness and architectural concerns
          4. Code quality, readability, and maintainability
          5. Test coverage and missing tests
          6. Clippy warnings and suggestions
          7. Performance considerations
          8. API, serialization, compatibility, and security concerns where
             applicable
          9. Specific improvements with file:line references

          Prioritize actionable findings over generic praise.

          Clearly distinguish:
          - actual bugs
          - likely problems
          - risks / design concerns
          - optional improvements

          Do not invent issues that are not supported by the code.

          The final output must be well-formatted Markdown suitable for posting
          directly as a pull-request review comment.

          Do not post the review yourself.

          Write the final review to:

              /tmp/pr-review.md
          EOF
          )"

          # Make sure OpenCode actually produced the review.
          if [ ! -s /tmp/pr-review.md ]; then
            echo "OpenCode did not produce /tmp/pr-review.md"
            exit 1
          fi

          echo "Review generated:"
          sed -n '1,120p' /tmp/pr-review.md

          # Publish the review through ngit.
          ngit \
            --nsec-file "$NGIT_NSEC_FILE" \
            pr comment "$PR_ID" \
            --body "$(cat /tmp/pr-review.md)" \
            --json

          # Remove the secret as soon as it is no longer needed.
          rm -f "$NGIT_NSEC_FILE"
