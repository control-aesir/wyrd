name: rust-ci

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Resolve the channel pinned in rust-toolchain.toml. It is passed as an
      # explicit `toolchain` input rather than letting the action read the
      # file: file-driven mode installs every target in the file (the macOS
      # and Linux cross-compile triples), and a literal "rust-toolchain.toml"
      # value is rejected by rustup as an invalid toolchain name.
      - name: Resolve pinned channel
        id: pin
        run:
          echo "channel=$(awk -F'"' '/^channel/{print $2}'
          rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Installs rustup when missing (the ngit/act ubuntu image doesn't ship
      # it), then the pinned channel with a minimal profile + clippy.
      # Toolchain and registry are cached between runs.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy

      - name: Check
        run: cargo check --color never 2>&1 | tee /tmp/check.log

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      - name: Tests
        run: cargo test --color never --workspace 2>&1 | tee /tmp/test.log

      - name: Run OpenCode
        if: github.event_name == 'pull_request'
        uses: anomalyco/opencode/github@latest
        env:
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/openrouter/free
          prompt: |
            # Full branch code review compared to master, posts to PR

            Current branch:!`git branch --show-current`
            PR info:!`ngit pr list --json --offline`
            Recent commits (master..HEAD):!`git log master..HEAD --oneline`
            Diff stats:!`git diff master..HEAD --stat`

            ### Code quality checks:
            Check:!`cat /tmp/check.log`
            Clippy:!`cat /tmp/clippy.log`
            Tests:!`cat /tmp/test.log`

            ## **Your task:** 
            1. Analyze the above information and produce a comprehensive code review covering:
               - Overall assessment
               - Potential bugs/edge cases
               - Code quality (style, readability, maintainability)
               - Test coverage observations
               - Clippy warnings/suggestions
               - Performance considerations
               - Specific improvements with file:line references

            2. **After writing the review**, post it as a PR comment:
               - Extract the PR `id` (nevent1...) from the PR info JSON where `branch` contains the current branch name
               - Run: `ngit --nsec $NGIT_NSEC pr comment <PR_ID> --body "$(cat <<'EOF'\n<your-review-text>\nEOF\n)" --json`
               
               Use the bash tool to execute this. The review should be well-formatted markdown.

            Be constructive and specific. Reference actual files and line numbers. Do not impersonate the user and make clear where the review comes from.
