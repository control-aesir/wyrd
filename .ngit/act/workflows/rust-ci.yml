name: rust-ci

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".ngit/act/workflows/rust-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Resolve the channel pinned in rust-toolchain.toml. It is passed as an
      # explicit `toolchain` input rather than letting the action read the
      # file: file-driven mode installs every target in the file (the macOS
      # and Linux cross-compile triples), and a literal "rust-toolchain.toml"
      # value is rejected by rustup as an invalid toolchain name.
      - name: Resolve pinned channel
        id: pin
        run:
          echo "channel=$(awk -F'"' '/^channel/{print $2}'
          rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Installs rustup when missing (the ngit/act ubuntu image doesn't ship
      # it), then the pinned channel with a minimal profile + clippy.
      # Toolchain and registry are cached between runs.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy

      # Pre-built nextest binary (nextest-rs recommended installer).
      - uses: taiki-e/install-action@nextest

      - name: Check
        run: |
          set -o pipefail
          cargo check --color never 2>&1 | tee /tmp/check.log

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      # `insecure-fast-kdf` deliberately weakens the keystore KDF and is
      # enabled only from dev-dependencies so integration tests can build a
      # real Engine affordably. Guard production: the normal dependency graph
      # (no dev/test edges) must never enable it. Never treat an
      # `--all-features` artifact as production.
      - name: Production feature graph excludes insecure-fast-kdf
        run: |
          set -euo pipefail
          cargo tree -e normal,features --workspace > /tmp/features.log
          if grep -q insecure-fast-kdf /tmp/features.log; then
            echo "error: the normal dependency graph enables insecure-fast-kdf" >&2
            grep -n insecure-fast-kdf /tmp/features.log >&2
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          cargo nextest run --color never --workspace 2>&1 | tee /tmp/test.log

      # Nextest skips doctests; this gate keeps them validated as API
      # examples appear. Cheap while empty, load-bearing later.
      - name: Doctests
        run: |
          set -o pipefail
          cargo test --color never --workspace --doc 2>&1 | tee /tmp/doctests.log

      # Warms the reporter's event cache first: cold full-state relay
      # syncs cost minutes per ngit call, and the scan makes several.
      - name: Restore ngit event cache
        if: failure()
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HOME }}/.ngit-event-cache
          key: ngit-events-Linux-${{ github.run_id }}
          restore-keys: ngit-events-Linux-

      # Installs ngit for the failure reporter below, from a
      # checksum-pinned manifest. Runs only on `pull_request` failures,
      # matching the reporter condition, so green runs pay nothing.
      - name: Install ngit for failure reporting
        if: failure() && github.event_name == 'pull_request'
        uses: danconwaydev/setup-ngit@v3
        with:
          version: 3.0.1

      # On `pull_request` failures only: post a truncated failure tail on
      # the PR and return it to draft so the board stops advertising a
      # ready PR. Master pushes and dispatch runs have no PR to draft and
      # are excluded by the step condition. The shared reporter library
      # holds the resolution, comment, and draft logic (see
      # .ngit/act/lib/ngit-reporter.sh); only the gate logs differ per
      # workflow and pass as arguments below.
      - name: Report failure to PR and return to draft
        if: failure() && github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          NGIT_NSEC: ${{ secrets.NGIT_NSEC }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .ngit/act/lib/ngit-reporter.sh
          report_failure_to_pr \
            /tmp/check.log /tmp/clippy.log /tmp/features.log /tmp/test.log /tmp/doctests.log

      # Saves whatever the reporter synced (even on resolution failure:
      # partial warmth still helps the next run). Failure-gated like the
      # restore, so green runs pay nothing.
      - name: Save ngit event cache
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HOME }}/.ngit-event-cache
          key: ngit-events-Linux-${{ github.run_id }}
