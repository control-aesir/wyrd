# Release manifest for `ngit release publish`: with this committed, a release
# needs nothing but a version. Cutting one:
#
#   1. Rename the `[Unreleased]` CHANGELOG section to the version; the notes
#      below are extracted from that exact section.
#   2. Tag the release commit `v<version>` (the version derives from the tag
#      with one leading `v` stripped, so it must equal the Cargo version).
#   3. On each platform, produce the tarball named below (`dist/` is
#      gitignored build output). Native builds: `nix build .#wyrd-dist`
#      on the machine itself. Linux tarballs from a Mac: `build-linux-dist
#      <version>` from the devenv shell (containerized native builds,
#      input pinned to the release tag). A main release must ship all
#      three: ngit rejects partial platform coverage on the main channel.
#   4. `ngit release publish <version>` with `--blossom-server` (or a
#      kind-10063 server list from the publisher), plus `--relay` as needed.
#
# The first publish also creates the `wyrd` application owned by the
# publishing maintainer; repository maintainership alone grants no release
# authority, so decide who that owner is before publishing.
schema: 1
application: wyrd
name: Wyrd
summary: Decentralized, append-only, content-addressed drive system
description: |
  Wyrd treats a storage drive as an append-only, content-addressed store:
  files split into hash-addressed chunks, drive states as roots into a
  Merkle tree, deletion as a state change rather than erasure.
tags: [nostr, cli]
license: MIT
channel: main
release_notes: CHANGELOG.md
assets:
  - file: dist/wyrd-{version}-linux-x86_64.tar.gz
    filename: wyrd-{version}-linux-x86_64.tar.gz
    mime: application/gzip
    platforms: [linux-x86_64]
  - file: dist/wyrd-{version}-linux-aarch64.tar.gz
    filename: wyrd-{version}-linux-aarch64.tar.gz
    mime: application/gzip
    platforms: [linux-aarch64]
  - file: dist/wyrd-{version}-macos-aarch64.tar.gz
    filename: wyrd-{version}-macos-aarch64.tar.gz
    mime: application/gzip
    platforms: [macos-aarch64]
