[workspace]
resolver = "2"
members = [
    "crates/wyrd-format",
    "crates/wyrd-sync",
    "crates/wyrd-namespace",
    "crates/wyrd-fuse",
    "crates/wyrd-core",
    "crates/wyrd-daemon",
    "crates/wyrd-cli",
    "crates/wyrd-contracts",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
# Matches the project LICENSE (MIT). Crates inherit via `license.workspace`.
license = "MIT"

[workspace.lints.rust]
# The verified-head boundary rests on unsafe-impl auditability (see
# `wyrd_fuse::VerifiedSnapshot`): every unsafe surface in the workspace
# is an explicit, commented exception. Crates without an exception have
# none, so an accidental capability impl cannot compile.
unsafe_code = "deny"

# Vendored fuser 0.18.0 (vendor/fuser) with one divergence: the macOS
# branch mounts via libfuse3, because upstream's libfuse2 probe targets
# macFUSE 4.x and macFUSE 5.x fails that path silently. The vendored
# crate is deliberately not a workspace member, so the workspace lints
# above do not apply to it. Re-sync by copying crates.io 0.18.0 over
# vendor/fuser and re-applying the build.rs divergence; drop the patch
# once upstream moves macOS to libfuse3.
[patch.crates-io]
fuser = { path = "vendor/fuser" }

[workspace.dependencies]
# wyrd crates
wyrd-format = { path = "crates/wyrd-format" }
wyrd-sync = { path = "crates/wyrd-sync" }
wyrd-namespace = { path = "crates/wyrd-namespace" }
wyrd-fuse = { path = "crates/wyrd-fuse" }
wyrd-core = { path = "crates/wyrd-core" }
wyrd-daemon = { path = "crates/wyrd-daemon" }

# content hashing
blake3 = "1.8"
hex = "0.4"

# content-defined chunking (wyrd-owned parameters in wyrd-format::chunk)
fastcdc = { version = "5.0.0", default-features = false }

# errors
thiserror = "2"

# structured diagnostics (daemon backends, CLI mount log, live sync loop)
tracing = "0.1"

# FUSE boundary error mapping (daemon adapter only)
libc = "0.2"

# CLI parsing (CLI binary): derive structs replace hand-rolled argv
# surgery; credential-file hardening stays wyrd-owned
clap = { version = "4", features = ["derive"] }

# cryptographic primitives (substrate decisions T11/T12: audited crates
# only; wyrd-owned code never touches the arithmetic)
secp256k1 = { version = "0.30", features = ["global-context"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
# CSPRNG (the OsRng rand itself builds on)
getrandom = "0.2"
zeroize = "1.9"

# async runtime (time: the daemon mailbox supervisor polls relay health on a
# tick and backs off drainer recovery; same audited crate, additive feature)
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt", "macros", "net", "signal", "time"] }

# iroh stack — validated as a set, change both together and test.
# Exact pins (`=`): caret drift once silently invalidated the documented
# set, so bumps are deliberate edits here plus docs plus the full suite.
# (iroh-gossip was dropped as an unused dependency; gossip framing for
# snapshot announcements stays an open question in `docs/object-model.md`
# and re-adds the dependency when that decision lands.)
iroh = "=1.1.0"
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
# streaming primitives for bounded blob intake (versions match what the
# pinned iroh-blobs 0.103 already depends on; bump with the iroh set)
bao-tree = "=0.16.1"
bytes = "1"
futures-util = "0.3"
n0-future = "=0.3.2"

# nostr protocol (control-plane transport only: NIP-44 + NIP-59 gift wrap
# mailbox framing; object encryption stays Wyrd-owned per T11). Pinned with
# the iroh set above: bump together and run the full suite. A nostr-sdk bump
# additionally re-runs the notification-classification contract first
# (mailbox::tests_classification in wyrd-core): stream-recovery replay
# depends on first-seen/Event-arm vs replay/Message-arm classification, and
# a silent change there breaks abandoned-backlog recovery invisibly.
# Dependency audit: nostr and nostr-sdk reach faster-hex (key/id/signature
# display, NIP-49/59 hex payloads, NIP-42/negentropy frames; `cargo tree -i
# faster-hex` names both dependents) only through the length-validated
# `hex_decode` and the encode path — never the raw `hex_decode_unchecked`
# behind RUSTSEC-2026-0306 — and the lock carries the patched faster-hex
# 0.10.1, which nostr's `faster-hex = "0.10"` requirement admits. 0.10.1 is
# not a pure patch: it enables a build script (autocfg, already locked)
# and adds an aarch64 NEON check path, and its new optional defmt dep
# pulls defmt/bitflags-1.3.2 entries into the lock that nothing compiles,
# though the audit gate still covers them.
nostr = { version = "0.45.5", default-features = false, features = ["std", "nip44", "nip59", "os-rng"] }
nostr-connect = "0.45"
nostr-sdk = { version = "0.45.2", default-features = false, features = ["rustls-tls-webpki-roots"] }

# property testing (dev-only: generated-sequence suites for the state
# machines; never a production dependency)
proptest = "1"

# manifest parsing for the dependency-DAG layer contract (test-only: the
# checker reads member Cargo.tomls; never a production dependency)
toml = "1"
