[package]
name = "wyrd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's command line: the wyrd process host. Argument parsing, credential files, mount orchestration, diagnostics, and exit codes over the daemon's public surface."

[[bin]]
name = "wyrd"
path = "src/main.rs"

[dependencies]
wyrd-format.workspace = true
wyrd-sync.workspace = true
wyrd-core.workspace = true
wyrd-daemon.workspace = true
# Archive identity for `wyrd update`: blake3 names the artifact in
# reports and the transaction log. The digest is an identity, never
# trust — a locally supplied archive is verified structurally.
blake3.workspace = true
clap.workspace = true
fuser = "0.18"
getrandom.workspace = true
hex.workspace = true
libc.workspace = true
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Drive deployment configuration (`default.toml` in the drive
# directory): strict TOML parsing for the relay list and credential
# paths. The file holds no secrets, so this is parse-only — secret
# material still travels through hardened credential files.
toml.workspace = true
# Mount diagnostics: structured events to stderr plus a per-mount file,
# and a bridge so fuser's log records land in the same record.
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-log = "0.2"
zeroize.workspace = true

[dev-dependencies]
# Downstream tests build a real `Engine` per test; enabling the fast KDF
# profile here keeps that affordable without touching production builds.
wyrd-sync = { workspace = true, features = ["insecure-fast-kdf"] }
# In-process relay for the vault process test (test-only: rust-nostr's
# real relay beside the binary under test; never a runtime dependency).
nostr-sdk = { workspace = true, features = ["local-relay"] }
tokio.workspace = true
# The mount-path tests name the composed view type explicitly; the
# binary itself only ever touches it through the daemon's surface.
wyrd-fuse.workspace = true

[lints]
workspace = true
