[package]
name = "wyrd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's embeddable local node: namespace, snapshots, mutations, materialization, and sync control over wyrd-sync. No presentation, no argument parsing, no process supervision."

[dependencies]
wyrd-format.workspace = true
wyrd-sync.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Downstream tests build a real `Engine` per test; enabling the fast KDF
# profile here keeps that affordable without touching production builds.
wyrd-sync = { workspace = true, features = ["insecure-fast-kdf"] }
# In-process websocket relay for mailbox integration tests (test-only:
# a minimal NIP-01 server; never a runtime dependency).
tokio-tungstenite = "0.28"
serde_json = "1"

[lints]
workspace = true
