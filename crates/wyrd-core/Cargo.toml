[package]
name = "wyrd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's embeddable local node: namespace, snapshots, mutations, materialization, and sync control over wyrd-sync. No presentation, no argument parsing, no process supervision."

[dependencies]
wyrd-format.workspace = true
wyrd-sync.workspace = true
wyrd-namespace.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Downstream tests build a real `Engine` per test; enabling the fast KDF
# profile here keeps that affordable without touching production builds.
wyrd-sync = { workspace = true, features = ["insecure-fast-kdf"] }
# In-process websocket relay for mailbox integration tests (test-only:
# a minimal NIP-01 server; never a runtime dependency).
tokio-tungstenite = "0.28"
# Second relay implementation for the cross-implementation episode
# (test-only: rust-nostr's real relay — signature verification, real OKs,
# real history — beside the fake above; never a runtime dependency).
nostr-sdk = { workspace = true, features = ["local-relay"] }
serde_json = "1"
# Log capture for the send-path outcome test (test-only: asserts the
# relay's answer reaches the debug line; never a runtime dependency).
tracing-subscriber = "0.3"
# Zeroizing wrappers for the trigger test's held epoch key (test-only:
# installs a known control key without touching the keystore).
zeroize = "1.9"
# Curve operations for the trigger test's peer key (test-only: derives
# a valid encryption key for the admission; never a runtime dependency).
secp256k1.workspace = true
# Live iroh endpoint for the catch-up fetch leg (test-only: the loopback
# bulk fetch runs over real transport; never a runtime dependency).
iroh.workspace = true

[lints]
workspace = true
