[package]
name = "wyrd-daemon"
version.workspace = true
edition.workspace = true
description = "Wyrd's daemon: composes the sync engine with the drive view and presentation backends (FUSE today, platform file surfaces later)"

[[bin]]
name = "wyrd"
path = "src/main.rs"

[dependencies]
wyrd-format.workspace = true
wyrd-sync.workspace = true
wyrd-fuse.workspace = true
fuser = "0.18"
futures-util.workspace = true
hex.workspace = true
libc.workspace = true
nostr.workspace = true
nostr-connect.workspace = true
nostr-sdk.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json = "1"
# In-process websocket relay for live mailbox integration tests (test-only:
# a minimal NIP-01 server; never a runtime dependency).
tokio-tungstenite = "0.28"

[lints]
workspace = true
