[package]
name = "wyrd-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wyrd's peer-to-peer replication layer: iroh transport, peer roles, snapshot log exchange"

[dependencies]
wyrd-format.workspace = true

iroh.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true
bao-tree.workspace = true
bytes.workspace = true
n0-future.workspace = true
nostr.workspace = true

secp256k1.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
argon2.workspace = true
getrandom.workspace = true
blake3.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Zeroize secret material on drop (root key, epoch secrets, capability and
# keystore plaintexts). `derive` gives us `ZeroizeOnDrop` for the newtype
# wrappers; `Zeroizing<T>` covers the buffer-shaped temporaries.
zeroize = { version = "1.9", features = ["derive"] }

[features]
# SECURITY: deliberately weakens the keystore KDF (Argon2id to minimum
# memory, one pass). It exists only so downstream integration tests
# (wyrd-daemon, wyrd-contracts) that build a real `Engine` per test do not
# pay the production 64 MiB / t=3 cost. NEVER enable it in a production,
# release, or published artifact, and never treat an `--all-features`
# build as production. The production table stays pinned and covered by
# `kdf_parameters_are_pinned` and `prod_kdf_params_round_trip` in
# `keys::keystore`.
insecure-fast-kdf = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
