# Dependency policy enforced by `cargo deny check` and the pre-push hooks in
# devenv.nix. Reviewed 2026-09-19 against the full Cargo.lock license
# inventory: every allowed license below appears in the current graph, and
# every graph license is allowed. Re-review this list when adding a dependency
# under a license not already here — especially copyleft ones.
#
# License notes from that inventory:
# - `self_cell` and `r-efi` carry OR expressions with GPL-2.0-only /
#   LGPL-2.1-or-later alternatives, but each also offers Apache-2.0 or MIT, so
#   they check out under the permissive choice. No crate is GPL-only.
# - `attohttpc` (via `igd-next`) is the single MPL-2.0-only crate. MPL-2.0 is
#   file-level copyleft with no repo-wide effect; allowed deliberately.

[advisories]
# Vulnerabilities always fail and cannot be downgraded. Soundness
# advisories fail too: this workspace holds drive keys, so an `unsound`
# crate anywhere in the graph blocks rather than warns. (Precedent:
# RUSTSEC-2026-0306 in faster-hex <= 0.10.0, via pinned nostr 0.45;
# resolved by the 0.10.1 bump — no exception needed. Reachability
# finding lives on the `nostr` dependency comment in Cargo.toml.)
# Yanked crates only warn. Unmaintained crates fail only when they are
# direct workspace dependencies: the three unmaintained advisories in
# the graph today (atomic-polyfill, paste, proc-macro-error) are
# transitive-only, so they are reported but do not block. Promote to
# `all` once those are eliminated.
yanked = "warn"
unmaintained = "workspace"
unsound = "all"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate crate versions only warn: ~30 crates currently carry two
# versions each (crypto, rand, windows-targets families among them;
# getrandom and rand_core carry three), not just the r-efi 5.3/6.0 pair
# this note once named. Promote to deny once the graph converges.
multiple-versions = "warn"

[sources]
# crates.io is the only permitted registry; the lockfile currently contains
# no git sources. Unknown registries fail, unknown git sources fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
