<svg class="network-svg" viewBox="0 0 520 430" xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="A single Wyrd dataset shared across several peers: a central snapshot connects to a laptop, a home vault, a phone, and another peer, each holding a different materialized view.">
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- peer/data paths -->
  <g fill="none" stroke="var(--rule)" stroke-width="1.5">
    <path class="network-path" d="M260 210 C205 160 150 120 95 92"/>
    <path class="network-path" d="M260 210 C330 160 385 120 440 92"/>
    <path class="network-path" d="M260 210 C190 255 145 305 95 350"/>
    <path class="network-path" d="M260 210 C330 255 375 305 425 350"/>
  </g>

  <!-- moving data pulses -->
  <g class="network-pulses" fill="var(--verdigris)">
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M260 210 C205 160 150 120 95 92"/></circle>
    <circle r="4"><animateMotion dur="3.1s" begin=".6s" repeatCount="indefinite" path="M260 210 C330 160 385 120 440 92"/></circle>
    <circle r="4"><animateMotion dur="3s" begin="1.1s" repeatCount="indefinite" path="M260 210 C190 255 145 305 95 350"/></circle>
    <circle r="4"><animateMotion dur="3.3s" begin=".25s" repeatCount="indefinite" path="M260 210 C330 255 375 305 425 350"/></circle>
  </g>

  <!-- central dataset -->
  <g class="network-core" filter="url(#softGlow)">
    <circle cx="260" cy="210" r="42" fill="var(--surface)" stroke="var(--verdigris)" stroke-width="2"/>
    <circle cx="260" cy="210" r="27" fill="none" stroke="var(--copper)" stroke-width="1.5"/>
    <circle cx="260" cy="210" r="8" fill="var(--verdigris)"/>
  </g>
  <text x="260" y="278" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--text)">one dataset</text>
  <text x="260" y="294" text-anchor="middle" font-family="var(--font-sans)" font-style="italic" font-size="10" fill="var(--text-dim)">shared history · content-addressed</text>

  <!-- peer nodes -->
  <g font-family="var(--font-mono)" font-size="10" fill="var(--text)">
    <g transform="translate(45 58)">
      <rect width="100" height="58" rx="6" fill="var(--surface)" stroke="var(--text-dim)" stroke-width="1"/>
      <rect x="17" y="13" width="28" height="20" rx="2" fill="none" stroke="var(--copper)" stroke-width="1.5"/>
      <path d="M13 37h36" stroke="var(--copper)" stroke-width="1.5"/>
      <text x="58" y="25">laptop</text>
      <text x="58" y="39" fill="var(--text-dim)">working set</text>
    </g>

    <g transform="translate(375 58)">
      <rect width="100" height="58" rx="6" fill="var(--surface)" stroke="var(--text-dim)" stroke-width="1"/>
      <rect x="18" y="12" width="25" height="25" rx="3" fill="none" stroke="var(--copper)" stroke-width="1.5"/>
      <circle cx="30.5" cy="31" r="2" fill="var(--copper)"/>
      <text x="55" y="25">vault</text>
      <text x="55" y="39" fill="var(--text-dim)">full history</text>
    </g>

    <g transform="translate(45 321)">
      <rect width="100" height="58" rx="6" fill="var(--surface)" stroke="var(--text-dim)" stroke-width="1"/>
      <rect x="20" y="9" width="20" height="36" rx="5" fill="none" stroke="var(--copper)" stroke-width="1.5"/>
      <circle cx="30" cy="39" r="1.8" fill="var(--copper)"/>
      <text x="55" y="25">phone</text>
      <text x="55" y="39" fill="var(--text-dim)">selected data</text>
    </g>

    <g transform="translate(375 321)">
      <rect width="100" height="58" rx="6" fill="var(--surface)" stroke="var(--text-dim)" stroke-width="1"/>
      <circle cx="29" cy="29" r="15" fill="none" stroke="var(--copper)" stroke-width="1.5"/>
      <circle cx="29" cy="29" r="5" fill="var(--copper)"/>
      <text x="55" y="25">peer</text>
      <text x="55" y="39" fill="var(--text-dim)">shared view</text>
    </g>
  </g>
</svg>
