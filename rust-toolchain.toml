[toolchain]
channel = "1.91.0"
components = [
  "rustfmt",
  "clippy",
  "rust-docs",
  "rust-analyzer",
]
targets = [
  "aarch64-apple-darwin",      # macOS Apple Silicon
  "x86_64-apple-darwin",       # macOS Intel
  "x86_64-unknown-linux-gnu",  # Linux x64 (glibc) — vaults / VPS
  "aarch64-unknown-linux-gnu", # Linux ARM64
]
profile = "default"
